<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- Metadados e configurações da página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Consultor pessoal para perfumes e colares. Encontre recomendações personalizadas.">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>Meu Consultor Pessoal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tela inicial com splash screen -->
    <header id="tela-inicial">
        <div class="boas-vindas">
            <span style="font-size: 50px;">✨</span>
            <h1>O que você busca hoje?</h1>
            <p>Escolha uma categoria para começar sua consultoria personalizada.</p>
            <nav class="botoes-home">
                <button type="button" onclick="entrarNoApp('perfumes')" class="btn-home">🌸 Perfumes</button>
                <button type="button" onclick="entrarNoApp('colares')" class="btn-home btn-colar-home">📿 Colares</button>
            </nav>
        </div>
    </header>

    <!-- Container principal da aplicação -->
    <main class="container" style="display: none;">
        <!-- Navegação por abas -->
        <nav class="menu-tabs">
            <button type="button" id="tab-perfumes" class="tab-btn" onclick="alternarAba('perfumes', this)">🌸 Perfumes</button>
            <button type="button" id="tab-colares" class="tab-btn" onclick="alternarAba('colares', this)">📿 Colares</button>
        </nav>

        <!-- Botão para alternar modo escuro -->
        <button type="button" id="dark-mode-toggle" onclick="toggleDarkMode()" class="btn-toggle">
            🌓 Alternar Tema
        </button>

        <!-- Seção de perfumes -->
        <section id="conteudo-perfumes" class="secao-aba">
            <button type="button" onclick="voltarParaHome()" class="btn-voltar">⬅ Voltar</button>
            <h2>🌸 Consultor de Perfumes</h2>
            
            <div class="estacao-selector">
                <label for="estacao-manual">Estação:</label>
                <select id="estacao-manual" onchange="atualizarEstacao()">
                    <option value="Outono">🍂 Outono</option>
                    <option value="Inverno">❄️ Inverno</option>
                    <option value="Primavera">🌸 Primavera</option>
                    <option value="Verão">☀️ Verão</option>
                </select>
            </div>

            <label for="periodo">Período:</label>
            <select id="periodo">
                <option value="dia">Dia</option>
                <option value="noite">Noite</option>
                <option value="ambos">Ambos</option>
            </select>

            <label for="vibe">Vibe:</label>
            <input type="text" id="vibe" placeholder="Qual a vibe hoje? (ex: doce)">
            
            <label for="nota">Nota:</label>
            <input type="text" id="nota" placeholder="Busque por uma nota (ex: baunilha, rosa)">
            
            <button type="button" onclick="buscar()">Encontrar Perfume</button>
            <button type="button" onclick="surpreender()" class="btn-surprise">
                ✨ Me surpreenda!
            </button>
        </section>

        <!-- Seção de colares -->
        <section id="conteudo-colares" class="secao-aba" style="display: none;">
            <button type="button" onclick="voltarParaHome()" class="btn-voltar">⬅ Voltar</button>
            <h2>📿 Colares</h2>
            
            <label for="tipo-blusa">Tipo de Blusa:</label>
            <select id="tipo-blusa">
                <option value="todos">Todos</option>
                <option value="T-shirt">T-shirt</option>
                <option value="Blusa Gola V">Blusa Gola V</option>
                <option value="Regata">Regata</option>
                <option value="Blusa Ciganinha">Blusa Ciganinha</option>
                <option value="Polo">Polo</option>
                <option value="Cache-coeur">Cache-coeur</option>
                <option value="Blusa Gola Alta">Blusa Gola Alta</option>
                <option value="Blusa Peplum">Blusa Peplum</option>
                <option value="Bata">Bata</option>
                <option value="Crop Top">Crop Top</option>
                <option value="Blusa Manga Bufante">Blusa Manga Bufante</option>
                <option value="Frente Única">Frente Única</option>
            </select>
            
            <button type="button" onclick="buscarColares()">Encontrar Colar</button>
            <button type="button" onclick="surpreenderColares()" class="btn-surprise">
                ✨ Me surpreenda!
            </button>
            <img src="assets/colar.jpg" alt="Catálogo de colares com designs variados para diferentes estilos" class="img-exibicao-colar">
        </section>

        <!-- Área para exibir resultados -->
        <div id="resultado"></div>
    </main>
    
    <!-- Scripts JavaScript -->
    <script src="script.js"></script>
    <script src="perfumes.js"></script>
    <script src="colares.js"></script>
</body>
</html>
