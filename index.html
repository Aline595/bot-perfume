<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Consultor de Perfumes</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        select, input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ddd; }
        button { background: #6a1b9a; color: white; border: none; cursor: pointer; font-weight: bold; }
        #resultado { margin-top: 20px; padding: 10px; border-top: 1px solid #eee; }

        .card-perfume {
            margin-top: 15px;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 12px;
            background: #fafafa;
            transition: transform 0.2s;
        }

        .card-perfume:hover {
            transform: scale(1.02);
        }

        .img-perfume {
            width: 100%;
            max-width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🌸 Consultor de Perfumes</h2>
    <p id="estacao-texto"></p>

    <select id="periodo">
        <option value="dia">Dia</option>
        <option value="noite">Noite</option>
        <option value="ambos">Ambos</option>
    </select>

    <input type="text" id="vibe" placeholder="Qual a vibe hoje? (ex: doce)">
    
    <button onclick="buscar()">Encontrar Perfume</button>

    <div id="resultado"></div>
</div>

<script>
    let perfumes = [];
    // URL do seu Gist (certifique-se de que é a versão Raw mais recente)
    const urlGist = "https://gist.githubusercontent.com/Aline595/d766a0ddf15dd9fc30ddf3de8a67b16f/raw/";
    
    async function carregarDados() {
        try {
            // Adicionamos um timestamp para evitar cache do navegador e pegar os IDs novos
            const resposta = await fetch(urlGist + "?t=" + new Date().getTime());
            perfumes = await resposta.json();
            console.log("✅ Dados do Gist carregados!", perfumes);
        } catch (erro) {
            console.error("❌ Erro ao carregar Gist:", erro);
        }
    }

    carregarDados();

    function calcularEstacao() {
        const mes = new Date().getMonth() + 1;
        if (mes >= 3 && mes <= 5) return "Outono";
        if (mes >= 6 && mes <= 8) return "Inverno";
        if (mes >= 9 && mes <= 11) return "Primavera";
        return "Verão";
    }

    const estacaoAtual = calcularEstacao();
    document.getElementById('estacao-texto').innerText = "Estamos no " + estacaoAtual;

    function buscar() {
        const periodo = document.getElementById('periodo').value;
        const vibeInput = document.getElementById('vibe').value.toLowerCase();
        const divResultado = document.getElementById('resultado');

        const filtro = perfumes.filter(p => {
            const clima = Array.isArray(p.clima) ? p.clima : [p.clima];
            const periodoList = Array.isArray(p.periodo) ? p.periodo : [p.periodo];
            const vibeList = Array.isArray(p.vibe) ? p.vibe : [p.vibe];

            const bateClima = clima.some(c => c.toLowerCase() === estacaoAtual.toLowerCase());
            const batePeriodo = (periodo === 'ambos') ? true : periodoList.some(per => per.toLowerCase() === periodo);
            const bateVibe = vibeInput === "" ? true : vibeList.some(v => v.toLowerCase().includes(vibeInput));

            return bateClima && batePeriodo && bateVibe;
        });

        if (filtro.length > 0) {
            divResultado.innerHTML = filtro.map(p => {
                // NOVA LÓGICA: Como o JSON agora tem apenas o ID, montamos o link direto aqui
                // Usamos o servidor googleusercontent que é mais estável para sites
                const urlFinal = p.imagem ? `https://lh3.googleusercontent.com/u/0/d/${p.imagem}` : '';

                return `
                    <div class="card-perfume">
                        ${urlFinal ? `
                            <img src="${urlFinal}" 
                                 class="img-perfume" 
                                 alt="${p.nome}" 
                                 onerror="this.src='https://via.placeholder.com/200?text=Ajustar+Permissão'">
                        ` : ''}
                        <div>
                            <strong style="color: #6a1b9a; font-size: 1.1em;">${p.nome}</strong>
                            <p style="font-size: 0.9em; color: #666;">Vibe: ${p.vibe ? p.vibe.join(', ') : 'N/A'}</p>
                            <p style="font-size: 0.8em; color: #999;">${p.marca || ''}</p>
                        </div>
                    </div>
                `;
            }).join('');
        } else {
            divResultado.innerHTML = "<p style='color: #999;'>❌ Nenhum perfume encontrado para os critérios selecionados.</p>";
        }
    }
</script>

</body>
</html>
