<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Consultor de Perfumes</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        select, input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ddd; }
        button { background: #6a1b9a; color: white; border: none; cursor: pointer; font-weight: bold; }
        #resultado { margin-top: 20px; padding: 10px; border-top: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <h2>🌸 Consultor de Perfumes</h2>
    <p id="estacao-texto"></p>

    <select id="periodo">
        <option value="dia">Dia</option>
        <option value="noite">Noite</option>
        <option value="ambos">Ambos</option>
    </select>

    <input type="text" id="vibe" placeholder="Qual a vibe hoje? (ex: doce)">
    
    <button onclick="buscar()">Encontrar Perfume</button>

    <div id="resultado"></div>
</div>

<script>
    let perfumes = [];
    const urlGist = "https://gist.githubusercontent.com/Aline595/d766a0ddf15dd9fc30ddf3de8a67b16f/raw/4ee581ea35019574542a7d0870408d5b86f730ad/lista_itens.json";
    
    async function carregarDados() {
        try {
            const resposta = await fetch(urlGist);
            perfumes = await resposta.json();
            console.log("✅ Dados do Gist carregados!");
        } catch (erro) {
            console.error("❌ Erro ao carregar Gist:", erro);
        }
    }

    // Chama a função assim que o site abre
    carregarDados();

    function calcularEstacao() {
        const mes = new Date().getMonth() + 1;
        if (mes >= 3 && mes <= 5) return "Outono";
        if (mes >= 6 && mes <= 8) return "Inverno";
        if (mes >= 9 && mes <= 11) return "Primavera";
        return "Verão";
    }

    const estacaoAtual = calcularEstacao();
    document.getElementById('estacao-texto').innerText = "Estamos no " + estacaoAtual;

    function buscar() {
        const periodo = document.getElementById('periodo').value;
       // const vibe = document.getElementById('vibe').value.toLowerCase();
        const divResultado = document.getElementById('resultado');

        const filtro = perfumes.filter(p => {
            const clima = Array.isArray(p.clima) ? p.clima : [p.clima];
            const periodoList = Array.isArray(p.periodo) ? p.periodo : [p.periodo];
            //const vibeList = Array.isArray(p.vibe) ? p.vibe : [p.vibe];

            const bateClima = clima.some(c => c.toLowerCase() === estacaoAtual.toLowerCase());
            const batePeriodo = (periodo === 'ambos') ? true : periodoList.some(per => per.toLowerCase() === periodo);
            //const bateVibe = vibeList.some(v => v.toLowerCase().includes(vibe));

            return bateClima && batePeriodo;
        });

        if (filtro.length > 0) {
            divResultado.innerHTML = filtro.map(p => `<strong>✨ ${p.nome}</strong>`).join('<br>');
        } else {
            divResultado.innerHTML = "❌ Nada encontrado.";
        }
    }
</script>

</body>
</html>
